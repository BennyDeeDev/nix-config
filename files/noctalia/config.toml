[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.0
    capsule = true
    capsule_padding = 10.0
    capsule_thickness = 0.99999998137354851
    center = [ "group:g2" ]
    concave_edge_corners = false
    end = [ "privacy", "cpu", "temp", "ram", "weather", "group:g1" ]
    margin_edge = 6
    margin_ends = 0
    shadow = false
    start = [ "Session2", "session", "workspaces" ]

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "date", "clock" ]
        opacity = 1.0
        padding = 10.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "audio_visualizer", "media" ]
        opacity = 1.0
        padding = 10.0

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "dark_mode"

[[control_center.shortcuts]]
type = "keyboard_layout"

[[control_center.shortcuts]]
type = "clipboard"

[dock]
auto_hide = true
concave_edge_corners = false
enabled = true
pinned = [ "brave-browser", "com.mitchellh.ghostty", "code", "spotify", "org.gnome.Nautilus", "dev.noctalia.Noctalia" ]
reserve_space = false

[hooks]
theme_mode_changed = "noctalia msg wallpaper-random"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd.kinds]
media = false

[shell]
panel_anchor_bar = "default"

    [shell.panel]
    control_center_placement = "floating"

[theme]
builtin = "Catppuccin"
community_palette = "Catppuccin Mocha Mauve-Lavender"
mode = "dark"
source = "community"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "helix", "niri", "starship" ]
    enable_community_templates = false

[wallpaper]
directory_dark = "/home/benjamin/Repos/nix-config-noctalia-niri/files/noctalia/dark"
directory_light = "/home/benjamin/Repos/nix-config-noctalia-niri/files/noctalia/light"

    [wallpaper.default]
    path = "/home/benjamin/Repos/nix-config-noctalia-niri/files/noctalia/dark/dark.png"

    [wallpaper.last]
    path = "/home/benjamin/Repos/nix-config-noctalia-niri/files/noctalia/dark/dark.png"

    [wallpaper.monitors.DP-1]
    path = "/home/benjamin/Repos/nix-config-noctalia-niri/files/noctalia/dark/dark.png"

[widget.Session2]
font_scale = 1.25
text = "󱄅"
type = "text"

    [widget.Session2.actions]
    left = "panel-toggle session"

[widget.audio_visualizer]
bands = 4
color_2 = "secondary"
scale = 0.75
show_when_idle = true
width = 34

    [widget.audio_visualizer.actions]
    left = "panel-open control-center"

[widget.cpu]
visualization = "none"

[widget.media]
hide_album_art = true

[widget.network]
show_label = false

[widget.ram]
visualization = "none"

[widget.session]
enabled = false

[widget.temp]
visualization = "none"

[widget.weather]
show_condition = false

[widget.workspaces]
active_pill_size = 2.5
inactive_pill_size = 1.25
show_labels = false
